---
layout: default
---
<div class="post-float-layout">
  {% include toc.html %}
  <article class="post nes-container is-dark">
    <header class="post-header">
      <h1 class="post-title">{{ page.title | escape }}</h1>
      <p class="post-meta">{{ page.date | date: "%Y-%m-%d" }}</p>
    </header>
    <div class="post-content">
      {{ content }}
    </div>
  </article>
</div>
